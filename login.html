<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Johny Cell</title>
    <link rel="stylesheet" href="src/css/logincss.css">
</head>
<body>
    <header>
        <img src="src/imagens/logo.webp" alt="Logo Johny Cell">
        <h1>Sistema de Gestão v1.0</h1>
    </header>
    <main>
        <section>
            <div class="foto">
                <img src="src/imagens/calc.png" alt="Foto login">
            </div>
            <form action="#">
                <label for="ilogin">Login:</label>
                <input type="text" name="login" id="ilogin">

                <label for="isenha">Senha:</label>
                <input type="password" name="senha" id="isenha">
                <p><a href="#">Esqueci minha senha</a></p>
                <input type="button" value="Entrar" id="btnlogin">
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; <a href="https://github.com/jonathan-cfa" target="_blank" rel="follow">Jonathan C.</a></p>
    </footer>
</body>
</html>
