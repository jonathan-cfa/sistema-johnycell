<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatar Cliente - Johny Cell</title>
    <link rel="stylesheet" href="../css/chamar.css">
    <link rel="shortcut icon" href="../images/favicon.svg" type="image/x-icon">
</head>

<body>
    <header>
        <img src="../images/logo.webp" alt="Logo Johny Cell">
        <h1>Sistema de Gestão v1.0</h1>
    </header>
    <main>
        <section>
            <h2>Contatar Cliente</h2>
            <label for="iclient">Nome do Cliente*:</label> <br>
            <input type="text" name="client" id="iclient"> <br>
            <label for="inumber">Contato*:</label> <br>
            <input type="text" name="number" id="inumber"> <br>
            <label for="imenseger">Mensagem*:</label> <br>
            <textarea name="menseger" id="imenseger" rows="10"></textarea> <br>
            <button id="btn-send">Enviar</button>

        </section>
    </main>
    <footer>
        <p>&copy; Desenvolvido por <a href="https://github.com/jonathan-cfa" target="_blank" rel="follow">Jonathan
                C.</a> para <a href="https://www.instagram.com/johnycell.oficial/" target="_blank"
                rel="follow">@johnycell.oficial</a></p>
    </footer>

    <script src="../js/chamar.js"></script>
</body>

</html>
