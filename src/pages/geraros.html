<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Johny Cell</title>
    <link rel="stylesheet" href="../css/print.css">
    <link rel="shortcut icon" href="../images/favicon.svg" type="image/x-icon">
</head>

<body>
    <header>
        <img src="../images/logo.webp" alt="Logo Johny Cell">
        <h1>Sistema de Gestão v1.0</h1>
    </header>
    <main>
        <section id="createos">
            <h1>Nova O.S.</h1>

            <form>
                <fieldset>
                    <legend>Infor. O.S.</legend>
                    <label for="ios">Nº O.S.</label>
                    <input type="number" name="os" id="ios" disabled>
                    <label for="idata">Data Entrada:</label>
                    <input type="date" name="data" id="idata">
                    <label for="ihora">Hora da Entrada:</label>
                    <input type="time" name="hora" id="ihora">
                </fieldset>

                <fieldset>
                    <legend>Dados Cliente</legend>
                    <label for="icliente">Nome do Cliente:</label>
                    <input type="text" name="cliente" id="icliente">
                    <label for="itelefone">Número para Contato</label>
                    <input type="tel" name="tele" id="itelefone">
                </fieldset>

                <fieldset id="infotel">
                    <legend>Infor. Aparelho</legend>
                    <label for="iaparelho">Aparelho:</label>
                    <input type="text" name="aparelho" id="iaparelho">
                    <label for="iimei">IMEI:</label>
                    <input type="text" name="imei" id="iimei"> <br>
                    <label for="iliga">Aparelho Não liga?</label>
                    <input type="checkbox" name="liga" id="iliga">
                    <label for="itela">Tela quebrada</label>
                    <input type="checkbox" name="tela" id="itela">
                    <label for="ivibra">Vibra?</label>
                    <input type="checkbox" name="vibra" id="ivibra">
                    <label for="imarcas">Marcas de uso?</label>
                    <input type="checkbox" name="imarcas" id="imarcas">
                    <label for="ichip">Chip?</label>
                    <input type="checkbox" name="chip" id="ichip">
                    <label for="isd">Cartão SD?</label>
                    <input type="checkbox" name="isd" id="isd"> <br>
                    <label for="idefeito">Defeito Relatado:</label> <br>
                    <textarea name="defeito" id="idefeito" rows="5" cols="50"></textarea>
                    <label for="isenha">Senha do aparelho:</label>
                    <input type="text" name="senha" id="isenha">
                </fieldset>
                <fieldset>
                    <legend>Custos</legend>
                    <label for="icusto">Valor total de serviço: R$</label>
                    <input type="number" name="custo" id="icusto">
                </fieldset>
                <input type="button" value="IMPRIMIR" id="primir">
                <input type="button" value="WHATSAPP" id="contatar">
            </form>
        </section>

        <section id="printos">
            <div class="cabeca">
                <img src="src/images/logo.webp" alt="Logo Johny Cell" class="imgcab">
                <p>Rua Rosa Fernandes da Silva, 3, Nova Esperança - Parnamirim/rn</p>
                <p>(84)99817-1353</p><br>
                </h2>
                <p class="os" id="ros"></p> <br>
            </div>

            <p id="rdata"></p>
            <p id="rhora"></p>
            <p id="rcliente"></p>
            <p id="rcontato"></p>
            <p id="raparelho"></p>
            <p id="rimei"></p>
            <p id="rliga"></p>
            <p id="rtela"></p>
            <p id="rvibra"></p>
            <p id="rmarca"></p>
            <p id="rchip"></p>
            <p id="rsd"></p>
            <p id="rdefeito"></p>
            <p id="rsenha"></p>
            <p id="rcusto"></p> <br>
            <p>Siga @johnycell.oficial no instagram</p> <br>
            <p>Deus te abençoe!</p>
        </section>
    </main>
    <footer>
        <p>&copy; Desenvolvido por <a href="https://github.com/jonathan-cfa" target="_blank" rel="follow">Jonathan
                C.</a> para <a href="https://www.instagram.com/johnycell.oficial/" target="_blank"
                rel="follow">@johnycell.oficial</a></p>
    </footer>
    <script src="src/js/print.js"></script>
</body>

</html>
